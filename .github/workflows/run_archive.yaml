on:
  schedule:
    # At 15:15 on Thursdays every week in Sep - Jan
    - cron: '15 15 * 9-12,1 4'
    # At 15:15 on the 15th day of each month from Feb -> Aug
    - cron: '15 15 15 2-8 *'
  workflow_dispatch:

name: archive_nflversedata

# Copies every nflverse-data release into a dated release of
# nflverse-data-archives. Tokens: write access to nflverse-data-archives only,
# minted after setup (which installs unpinned GitHub code). nflverse-data is
# public, so the same token reads it. See https://github.com/nflverse/actions
permissions:
  contents: read

jobs:
  create_release:
    runs-on: ubuntu-latest
    name: create_release
    outputs:
      releases: ${{ steps.query_releases.outputs.releases }}
      release_tag: ${{ steps.create_tag.outputs.release_tag }}
    steps:
      - id: archive-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflverse-data-archives
          contents: write

      - name: Create release with gh
        id: create_tag
        env:
          GH_TOKEN: ${{ steps.archive-token.outputs.token }}
        run: |
          release_tag=archive-$(date '+%Y-%m-%d')
          gh release create $release_tag -t $release_tag -R nflverse/nflverse-data-archives || true
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - id: query_releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "releases=$(gh release list -R nflverse/nflverse-data --exclude-drafts --json tagName --jq '[.[].tagName]')" > $GITHUB_OUTPUT

  archive_nflversedata:
    needs: create_release
    runs-on: ubuntu-latest
    container: ghcr.io/nflverse/r-runner:latest
    name: Archive ${{ matrix.tag }} under ${{ needs.create_release.outputs.release_tag }}
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.create_release.outputs.releases) }}
    env:
      NFLVERSE_ARCHIVE_TAG: ${{ matrix.tag }}
      NFLVERSE_ARCHIVE_TO: ${{ needs.create_release.outputs.release_tag }}
    steps:
      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflreadr ropensci/piggyback
          install-local: true

      - id: archive-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflverse-data-archives
          contents: write

      - name: Archive nflverse release ${{ matrix.tag }}
        run: Rscript dev/run_archive.R
        env:
          # gh cli: download from nflverse-data, upload to nflverse-data-archives
          GH_TOKEN: ${{ steps.archive-token.outputs.token }}
