on:
  schedule:
    # At 15:15 on Thursdays every week in Sep - Jan
    - cron: '15 15 * 9-12,1 4'
    # At 15:15 on the 15th day of each month from Feb -> Aug
    - cron: '15 15 15 2-8 *'
  workflow_dispatch:

name: archive_s3
jobs:
  archive_s3:
    runs-on: ubuntu-latest
    name: archive_s3
    env:
      GITHUB_PAT: ${{ secrets.NFLVERSE_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.NFLVERSE_GH_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
            ropensci/piggyback
            nflverse/nflreadr
      - name: Download release files to archive
        run: Rscript dev/run_s3_archive.R
      - name: Install rclone
        # Ubuntu's apt rclone (v1.60) fails on R2 with 501 NotImplemented,
        # so install a pinned upstream release and verify its checksum
        env:
          # Not RCLONE_*: rclone reads those env vars as flags
          PINNED_RCLONE: v1.76.0
        run: |
          cd "$RUNNER_TEMP"
          zip="rclone-${PINNED_RCLONE}-linux-amd64.zip"
          gh release download "$PINNED_RCLONE" -R rclone/rclone -p "$zip" -p SHA256SUMS
          grep " ${zip}\$" SHA256SUMS | sha256sum --check --strict
          unzip -q "$zip"
          sudo install -m 0755 "${zip%.zip}/rclone" /usr/local/bin/rclone
          rclone version
      - name: Copy archive to S3 via rclone
        env:
          RCLONE_CONFIG_NFLCF_TYPE: s3
          RCLONE_CONFIG_NFLCF_PROVIDER: Cloudflare
          RCLONE_CONFIG_NFLCF_ACCESS_KEY_ID: ${{ secrets.NFLVERSE_CLOUDFLARE_ACCESS_KEY }}
          RCLONE_CONFIG_NFLCF_SECRET_ACCESS_KEY: ${{ secrets.NFLVERSE_CLOUDFLARE_SECRET_ACCESS_KEY }}
          # The secret holds a bare host (minioclient added the scheme itself)
          RCLONE_CONFIG_NFLCF_ENDPOINT: https://${{ secrets.NFLVERSE_CLOUDFLARE_S3_ENDPOINT }}
          # Bucket already exists; skip the create check that scoped R2 tokens can't do
          RCLONE_CONFIG_NFLCF_NO_CHECK_BUCKET: "true"
        # rclone copies a directory's contents, so name the target prefix explicitly
        # to keep the existing nflverse/archive/<date>/rds/... key layout
        run: rclone copy archive nflcf:nflverse/archive --verbose --stats-one-line --stats 30s
